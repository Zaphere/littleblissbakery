kind = "web"
previewPath = "/"
title = "Little Bliss Bakery"
description = "A local-first bakery management, costing, orders, inventory, budget, and profit system for Little Bliss Bakery in Eswatini."
version = "1.0.0"
id = "artifacts/little-bliss-bakery"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24766

[services.development]
run = "pnpm --filter @workspace/little-bliss-bakery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/little-bliss-bakery", "run", "build" ]
serve = "static"
publicDir = "artifacts/little-bliss-bakery/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24766"
BASE_PATH = "/"
